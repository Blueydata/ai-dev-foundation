services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run db:migrate && npm run dev -- --hostname 0.0.0.0"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      TEST_DATABASE_URL: postgres://app:app@db:5432/app_test
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  infra:
    build: ./infra/tools
    profiles:
      - infra
    working_dir: /workspace
    environment:
      - AWS_PROFILE
      - AWS_REGION
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - IMAGE_TAG
    volumes:
      - .:/workspace
      - infra-cache:/cache
      - ~/.aws:/root/.aws

volumes:
  postgres-data:
  infra-cache:
